# Publica no GitHub Pages cada pasta da raiz que tenha um index.html
name: GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - name: Montar site
        run: |
          mkdir -p _site
          touch _site/.nojekyll
          links=""
          for dir in */; do
            name="${dir%/}"
            [ "$name" = "_site" ] && continue
            [ -f "$name/index.html" ] || continue
            mkdir -p "_site/$name"
            cp -r "$name"/. "_site/$name/"
            links="$links<li><a href=\"$name/\">$name</a></li>"
          done
          printf '<!doctype html><meta charset="utf-8"><title>Publicados</title><h1>Publicados</h1><ul>%s</ul>\n' "$links" > _site/index.html

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - id: deployment
        uses: actions/deploy-pages@v4
